name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Release automation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.prs != '' || steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.tag_name || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.release.outputs.prs != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release.outputs.prs != ''
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.release.outputs.prs != ''
      - name: Format generated release metadata and run checks
        if: steps.release.outputs.prs != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            const path = require('node:path');
            const prettier = require(path.join(process.env.GITHUB_WORKSPACE, 'node_modules/prettier'));
            const prs = JSON.parse(process.env.RELEASE_PRS || '[]');
            for (const pr of prs) {
              const branch = pr.headBranchName;
              for (const filePath of ['.release-please-manifest.json', 'CHANGELOG.md', 'README.md', 'package.json']) {
                const {data: file} = await github.rest.repos.getContent({
                  ...context.repo, path: filePath, ref: branch
                });
                const content = Buffer.from(file.content, 'base64').toString('utf8');
                const cleaned = filePath === 'CHANGELOG.md'
                  ? content.replace(/^(## .+?) \(\d{4}-\d{2}-\d{2}\)$/gm, '$1')
                    .replace(/\n## Changelog\n\nRelease notes are maintained by release-please\.\s*$/, '\n')
                  : content;
                const options = await prettier.resolveConfig(filePath);
                const formatted = await prettier.format(cleaned, {...options, filepath: filePath});
                if (formatted !== content) {
                  await github.rest.repos.createOrUpdateFileContents({
                    ...context.repo, path: filePath, branch, sha: file.sha,
                    message: 'chore(release): format generated metadata',
                    content: Buffer.from(formatted).toString('base64')
                  });
                }
              }
              for (const workflow_id of ['ci.yml', 'quality.yml', 'security.yml']) {
                await github.rest.actions.createWorkflowDispatch({
                  ...context.repo, workflow_id, ref: pr.headBranchName
                });
              }
            }
      - name: Generate release SBOM
        if: steps.release.outputs.release_created == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach SBOM
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" sbom.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
